<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#2f64c9">
<meta name="description" content="תקציב שנתי: הכנסות, הוצאות, חסכונות והון עצמי, חודש אחרי חודש. הנתונים נשמרים רק במכשיר שלך.">
<title>תקציב שנתי</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header id="hdr" hidden>
  <h1>תקציב שנתי</h1>
  <select id="yr" aria-label="שנה"></select>
  <span class="sp"></span>
  <button id="undo" aria-label="ביטול פעולה" title="ביטול (Ctrl+Z)">↶</button>
  <button id="redo" aria-label="שחזור פעולה" title="שחזור (Ctrl+Y)">↷</button>
  <button id="hdrImport" title="טעינת מסמכים">⬆ מסמכים</button>
  <button id="hdrBackup" title="שמירת גיבוי לקובץ">⬇ גיבוי</button>
</header>
<nav id="nav" hidden></nav>
<main id="main"><section class="box">טוען…</section></main>
<div id="status" role="status"></div>
<div id="modal" class="modal" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgMsg">
    <p id="dlgMsg"></p>
    <div id="dlgBody"></div>
    <div class="dlgBtns">
      <button id="dlgOk" class="pri">אישור</button>
      <button id="dlgCancel" class="ghost">ביטול</button>
    </div>
  </div>
</div>
<input type="file" id="fileBackup" accept=".json,application/json" hidden>
<input type="file" id="fileDocs" accept=".xlsx,.xls,.csv,.txt" multiple hidden>
<script src="js/calc.js"></script>
<script src="js/demo.js"></script>
<script src="js/store.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="js/importer.js"></script>
<script src="js/app.js"></script>
<script src="js/wizard.js"></script>
<script src="js/import-ui.js"></script>
</body>
</html>
