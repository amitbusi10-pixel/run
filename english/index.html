<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>אנגלית מהבסיס</title>
<meta name="theme-color" content="#1b3fa8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap">
<style>
/* Layout: school-workbook look. White paper, black ink, blue pen for headings, red pen for corrections.
   Desktop: centered 940px sheet under a tab bar of the six unit stages. Phone: same, stacked. Single light theme by choice. */
:root{
  --paper:#ffffff; --ink:#1b1b1b; --muted:#555555; --rule:#c9c9c9; --rule-strong:#222222;
  --pen:#1b3fa8; --pen-soft:#eef2fc; --red:#c4251c; --red-soft:#fdecea; --green:#1d7a3a; --green-soft:#e8f5ec;
  --hl:#fff6c9; --font:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif; color-scheme:light;
}
*{box-sizing:border-box}
html{direction:rtl;background:var(--paper)}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.7;margin:0;
  padding-block:0 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:20}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:19;background:var(--paper);border-bottom:2px solid var(--rule-strong);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;max-width:980px;margin:0 auto}
.brand{font-weight:800;font-size:20px;color:var(--pen)}
.homebtn{border:1.5px solid var(--rule-strong);background:var(--paper);padding:6px 14px;border-radius:4px;font-weight:500}
.homebtn:hover{background:var(--pen-soft)}
.wrap{max-width:980px;margin:0 auto}
.tabs{display:flex;flex-wrap:wrap;gap:0;border-bottom:2px solid var(--rule-strong);margin-top:14px}
.tab{flex:1 1 auto;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 12px;border:1.5px solid var(--rule);border-bottom:0;background:#f3f3f3;margin-inline-end:-1.5px;font-size:16px;font-weight:500;border-radius:6px 6px 0 0}
.tab:hover{background:var(--pen-soft)}
.tab.on{background:var(--paper);border-color:var(--rule-strong);font-weight:800;color:var(--pen);position:relative;top:2px;border-bottom:2px solid var(--paper)}
.tn{display:inline-grid;place-items:center;width:22px;height:22px;border:1.5px solid currentColor;border-radius:50%;font-size:13px;font-weight:700;flex:none}
.tick{color:var(--green);font-weight:800}
.sheet{background:var(--paper);border:1.5px solid var(--rule);border-top:0;padding:28px clamp(16px,4vw,48px) 36px;display:flex;flex-direction:column;gap:18px;min-width:0}
.ubadge{align-self:flex-start;border:2px solid var(--pen);color:var(--pen);font-weight:800;padding:0 12px;border-radius:4px;font-size:15px}
.utitle{font-size:clamp(26px,4vw,36px);margin:0;line-height:1.25;text-wrap:balance}
.usub{color:var(--muted);margin-top:-14px;text-align:left;font-weight:500}
h2{font-size:25px;color:var(--pen);margin:0;padding-bottom:6px;border-bottom:3px double var(--pen);text-wrap:balance}
h3{font-size:19px;margin:6px 0 0;color:var(--ink)}
p{margin:0}
ul{margin:0;padding-inline-start:24px;display:flex;flex-direction:column;gap:6px}
.lead{color:var(--muted)}
.page{display:flex;flex-direction:column;gap:16px}
.ex{display:flex;align-items:center;gap:12px;border-bottom:1px dotted #999;padding:6px 2px}
.ex .two{display:flex;flex-direction:column;flex:1;min-width:0}
.en{direction:ltr;text-align:left;font-weight:700;color:var(--pen);font-size:19px;min-width:0}
.he{color:var(--muted);font-size:16px}
.spk{flex:none;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--pen);background:var(--paper);display:grid;place-items:center;color:var(--pen)}
.spk:hover{background:var(--pen-soft)}
.spk svg{width:19px;height:19px}
.note,.warnbox{padding:10px 16px;border:1.5px solid var(--pen);background:var(--pen-soft);border-radius:4px}
.warnbox{border-color:var(--red);background:var(--red-soft)}
.note>b:first-child,.warnbox>b:first-child{margin-inline-end:4px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{border:1.5px solid var(--rule-strong);padding:6px 12px;text-align:start;font-size:17px}
th{background:var(--pen-soft);color:var(--pen)}
td.l{direction:ltr;text-align:left;font-weight:700}
.pager{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pg{min-width:40px;padding:4px 12px;border:1.5px solid var(--rule-strong);background:var(--paper);border-radius:4px;font-weight:500}
.pg.on{background:var(--pen);color:#fff;border-color:var(--pen);font-weight:700}
.pg .sc{font-size:13px;margin-inline-start:6px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:8px 26px;border-radius:4px;border:2px solid var(--pen);background:var(--pen);color:#fff;font-weight:700}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:var(--paper);color:var(--pen)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:0 28px}
.vitem{display:flex;align-items:center;gap:10px;border-bottom:1px dotted #999;padding:6px 2px}
.vitem .en{flex:1}.vitem .he{flex:1;min-width:0}
.qhead{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:15px}
.bar{height:8px;border:1.5px solid var(--rule-strong);border-radius:99px;overflow:hidden;background:var(--paper)}
.bar>i{display:block;height:100%;background:var(--pen)}
.qp{font-size:22px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap;text-wrap:balance}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px}
.opt{min-height:52px;padding:10px 14px;border-radius:4px;border:1.5px solid var(--rule-strong);background:var(--paper);text-align:center;font-weight:500}
.opt:hover:not([disabled]){background:var(--pen-soft)}
.opt.picked{background:var(--pen-soft);border-color:var(--pen);border-width:2.5px}
.opt.right{background:var(--green-soft);border-color:var(--green);color:var(--green);font-weight:700}
.opt.wrong{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.fb{padding:10px 14px;border-radius:4px;border:1.5px solid}
.fb.ok{background:var(--green-soft);color:var(--green);border-color:var(--green)}
.fb.no{background:var(--red-soft);color:var(--red);border-color:var(--red)}
.score{font-size:72px;font-weight:800;line-height:1;text-align:center}
.score.ok{color:var(--green)}.score.no{color:var(--red)}
.center{text-align:center}
.rev{border:1.5px solid var(--rule);padding:10px 14px;display:flex;flex-direction:column;gap:4px;border-radius:4px}
.sub{color:var(--muted);font-size:16px}
.ltr{direction:ltr;text-align:left}
/* homework sheet */
.hwhead{border:2px solid var(--rule-strong);padding:10px 16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:700}
.items{display:flex;flex-direction:column;gap:2px}
.item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.item .n{flex:none;min-width:30px;font-weight:800;color:var(--pen)}
.item .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.q{font-size:19px}
input.blank{font:inherit;font-weight:700;color:var(--pen);direction:ltr;text-align:center;border:0;border-bottom:2px solid var(--rule-strong);background:var(--hl);border-radius:2px 2px 0 0;width:min(100%,11ch);min-width:5ch;padding:0 6px;margin-inline:6px}
input.full,textarea.full{font:inherit;font-weight:500;color:var(--pen);direction:ltr;text-align:left;width:100%;border:0;border-bottom:2px solid var(--rule-strong);background:var(--hl);padding:6px 8px;border-radius:2px 2px 0 0}
textarea.full{min-height:110px;resize:vertical;line-height:2;background:repeating-linear-gradient(var(--paper) 0 35px,#bbb 35px 36px);border:1.5px solid var(--rule)}
.ok-in{background:var(--green-soft)!important;border-bottom-color:var(--green)!important;color:var(--green)!important}
.no-in{background:var(--red-soft)!important;border-bottom-color:var(--red)!important;color:var(--red)!important;text-decoration:line-through}
.ans{color:var(--red);font-weight:700;direction:ltr;display:inline-block;margin-inline:8px}
.mrow{display:flex;flex-wrap:wrap;gap:8px}
.mopt{padding:4px 16px;border:1.5px solid var(--rule-strong);background:var(--paper);border-radius:4px;direction:auto}
.mopt.picked{background:var(--pen-soft);border-color:var(--pen);font-weight:700}
.mopt.right{background:var(--green-soft);border-color:var(--green);color:var(--green);font-weight:700}
.mopt.wrong{background:var(--red-soft);border-color:var(--red);color:var(--red);text-decoration:line-through}
.model{border:1.5px dashed var(--red);color:var(--red);padding:8px 12px;border-radius:4px;direction:ltr;text-align:left}
.model b{direction:rtl;unicode-bidi:isolate}
.result{border:2px solid var(--rule-strong);padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;font-weight:700}
/* contents page */
.toc{display:flex;flex-direction:column}
.toc button{display:flex;align-items:center;gap:12px;padding:14px 4px;border:0;border-bottom:1px dotted #777;background:var(--paper);text-align:start;width:100%}
.toc button:hover:not([disabled]){background:var(--pen-soft)}
.toc button[disabled]{color:#888;cursor:not-allowed}
.toc .nm{flex:1;min-width:0;font-weight:700;font-size:19px}
.toc .nm small{display:block;font-weight:400;color:var(--muted);direction:ltr;text-align:left;font-size:15px}
.chip{display:inline-block;font-size:13px;font-weight:700;border:1.5px solid var(--rule-strong);border-radius:99px;padding:0 10px;white-space:nowrap}
.chip.ok{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.chip.todo{border-color:var(--rule);color:var(--muted);font-weight:500}
.hero{display:flex;flex-direction:column;gap:6px}
.hero h1{font-size:clamp(32px,6vw,52px);margin:0;color:var(--pen);line-height:1.15}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;padding:8px;align-self:flex-start}
@media (max-width:640px){.tab{font-size:14px;padding:8px 6px}.tn{display:none}.sheet{padding-top:20px}.toc .chips{display:none}}
@media print{.top,.tabs,.btns,.pager{display:none}}
</style>

</head>
<body>
<div id="app"></div>

<script>
/* ===== helpers ===== */
const SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const spkBtn=t=>`<button class="spk" data-s="${esc(t)}" aria-label="השמעה">${SPK}</button>`;
const E=(en,he)=>`<div class="ex">${spkBtn(en)}<div class="two"><div class="en">${esc(en)}</div>${he?`<div class="he">${he}</div>`:''}</div></div>`;
const TBL=(h,rows)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${/^[\x00-\x7F]+$/.test(c)&&c.trim()?' class="l"':''}>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
const NOTE=t=>`<div class="note"><b>זכור:</b> ${t}</div>`;
const WARN=t=>`<div class="warnbox"><b>שים לב:</b> ${t}</div>`;
const L=t=>`<span class="ltr" dir="ltr">${t}</span>`;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function speak(t){try{const s=window.speechSynthesis;if(!s)return;s.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;s.speak(u)}catch(e){}}
const Q=a=>({p:a[0],c:a[1],w:[a[2],a[3],a[4]],e:a[5]});

/* ===== units ===== */
const UNITS=[
{id:'u1',name:'כינויי גוף ושייכות',en:'Pronouns',
 lessons:[
  {t:'מי עושה? כינויי גוף',h:`
   <p>כינוי גוף מחליף שם של אדם או חפץ. בכל משפט באנגלית חייב להיות מי שעושה, ולכן אלה המילים הראשונות ללמוד.</p>
   ${TBL(['English','עברית'],[['I','אני'],['you','אתה / את / אתם / אתן'],['he','הוא'],['she','היא'],['it','זה (חפץ, חיה, דבר)'],['we','אנחנו'],['they','הם / הן']])}
   ${NOTE('<b>I</b> נכתב תמיד באות גדולה, גם באמצע משפט.')}
   ${NOTE('<b>you</b> זה גם ליחיד וגם לרבים, גם לזכר וגם לנקבה. ההקשר מבהיר.')}
  `},
  {t:'he, she או it?',h:`
   <p>בעברית לכל דבר יש מין (שולחן זכר, כוס נקבה). באנגלית אין כזה:</p>
   <ul><li><b>he</b> רק לגבר או לילד.</li><li><b>she</b> רק לאישה או לילדה.</li><li><b>it</b> לכל חפץ, מקום, רעיון ובדרך כלל חיה.</li><li><b>they</b> לכמה אנשים או כמה דברים, זכרים ונקבות.</li></ul>
   ${E('Dan is my brother. He is nice.','דן הוא אחי. הוא נחמד.')}
   ${E('Maya is my friend. She is nice.','מאיה חברה שלי. היא נחמדה.')}
   ${E('The phone is new. It is black.','הטלפון חדש. הוא שחור.')}
   ${E('Dan and Maya are friends. They are nice.','דן ומאיה חברים. הם נחמדים.')}
   ${E('Dan and I are friends. We are nice.','דן ואני חברים. אנחנו נחמדים.')}
  `},
  {t:'שלי, שלך, שלו: מילות שייכות',h:`
   <p>כשרוצים להגיד של מי הדבר, מוסיפים מילת שייכות <b>לפני</b> הדבר.</p>
   ${TBL(['כינוי','מילת שייכות','משמעות'],[['I','my','שלי'],['you','your','שלך / שלכם'],['he','his','שלו'],['she','her','שלה'],['it','its','שלו / שלה (של דבר)'],['we','our','שלנו'],['they','their','שלהם / שלהן']])}
   ${E('This is my phone.','זה הטלפון שלי.')}
   ${E('Your name is Dan.','השם שלך הוא דן.')}
   ${E('His car is red.','המכונית שלו אדומה.')}
   ${E('Her bag is small.','התיק שלה קטן.')}
   ${E('Our house is big.','הבית שלנו גדול.')}
   ${E('Their names are Dan and Rina.','השמות שלהם הם דן ורינה.')}
   ${WARN('אל תבלבל בין <b>I</b> (אני) ל-<b>my</b> (שלי), ובין <b>we</b> (אנחנו) ל-<b>our</b> (שלנו).')}
  `}],
 vocab:[['I','אני'],['you','אתה / את / אתם'],['he','הוא'],['she','היא'],['it','זה (חפץ / חיה)'],['we','אנחנו'],['they','הם / הן'],['my','שלי'],['your','שלך'],['his','שלו'],['her','שלה'],['our','שלנו'],['their','שלהם'],['name','שם'],['man','גבר'],['woman','אישה'],['boy','ילד'],['girl','ילדה'],['friend','חבר'],['family','משפחה']],
 bank:[
  [`איך אומרים ״אני״ באנגלית?`,`I`,`He`,`We`,`You`,`I = אני, ותמיד באות גדולה.`],
  [`״היא״ באנגלית:`,`She`,`He`,`It`,`They`,`she = היא.`],
  [`״הם / הן״ באנגלית:`,`They`,`We`,`You`,`She`,`they = הם והן.`],
  [`״אנחנו״ באנגלית:`,`We`,`They`,`You`,`I`,`we = אנחנו.`],
  [`איזה כינוי מתאים ל״שולחן״ (חפץ)?`,`It`,`He`,`She`,`They`,`לחפץ אחד משתמשים ב-it.`],
  [`___ is my brother. (אחי)`,`He`,`She`,`It`,`We`,`אח הוא גבר, לכן he.`],
  [`___ is my sister. (אחותי)`,`She`,`He`,`It`,`They`,`אחות היא אישה, לכן she.`],
  [`Tom and I are friends. ___ are friends.`,`We`,`They`,`You`,`He`,`אני ועוד מישהו = we.`],
  [`Dan and Noa are students. ___ are students.`,`They`,`We`,`He`,`It`,`שני אנשים אחרים = they.`],
  [`״שלך״ באנגלית:`,`your`,`my`,`his`,`her`,`your = שלך.`],
  [`״שלי״ באנגלית:`,`my`,`your`,`our`,`I`,`my = שלי. I זה אני.`],
  [`This is ___ phone. (הטלפון של דן)`,`his`,`her`,`their`,`my`,`דן הוא גבר, לכן his.`],
  [`This is ___ bag. (התיק של שרה)`,`her`,`his`,`their`,`our`,`שרה היא אישה, לכן her.`],
  [`״שלנו״ באנגלית:`,`our`,`we`,`your`,`their`,`our = שלנו. we זה אנחנו.`],
  [`They are my parents. ___ names are Dan and Rina.`,`Their`,`His`,`Her`,`Our`,`של ההורים (הם) = their.`],
  [`We love ___ house. (הבית שלנו)`,`our`,`we`,`their`,`his`,`אחרי we בא our.`],
  [`מה ההבדל בין he ל-she?`,`he לגבר, she לאישה`,`he לאישה, she לגבר`,`אין הבדל`,`he לרבים, she ליחיד`,`he = הוא, she = היא.`],
  [`איזה כינוי מתאים גם ל״אתה״ וגם ל״אתם״?`,`you`,`he`,`they`,`we`,`you משמש ליחיד וגם לרבים.`],
  [`Maya is my friend. ___ is nice.`,`She`,`He`,`They`,`It`,`מאיה היא אישה, לכן she.`],
  [`The car is new. ___ is red.`,`It`,`He`,`She`,`We`,`מכונית היא חפץ, לכן it.`]
 ]},

{id:'u2',name:'הפועל to be: חיוב',en:'am / is / are',
 lessons:[
  {t:'am, is, are: להיות',h:`
   <p>בעברית אומרים ״אני עייף״ בלי פועל. באנגלית <b>חייבים</b> פועל באמצע: אני <b>הנני</b> עייף. הפועל הזה הוא <b>to be</b>, והוא הכי חשוב באנגלית.</p>
   ${TBL(['כינוי','to be','דוגמה'],[['I','am','I am tired'],['you','are','You are late'],['he','is','He is at home'],['she','is','She is happy'],['it','is','It is big'],['we','are','We are friends'],['they','are','They are ready']])}
   ${NOTE('כלל פשוט: <b>I</b> עם <b>am</b>. <b>he / she / it</b> עם <b>is</b>. כל השאר (<b>you / we / they</b>) עם <b>are</b>.')}
   ${E('I am a student.','אני סטודנט.')}
   ${E('She is a teacher.','היא מורה.')}
   ${E('We are at home.','אנחנו בבית.')}
  `},
  {t:'קיצורים: I\'m, he\'s, they\'re',h:`
   <p>בשיחה אנשים כמעט תמיד מקצרים. את הקיצורים חובה להכיר, גם כדי להבין וגם כדי להישמע טבעי.</p>

      inner=`<div class="q" dir="auto">${esc(it.q)}</div><div class="mrow">${opts}</div>`;
    }else{
      inner=`<div class="q" dir="auto">${esc(it.q)}</div><textarea class="full" data-i="${k}" rows="3" spellcheck="false" aria-label="כתיבה חופשית">${esc(v)}</textarea>${st.c?`<div class="model"><b>דוגמה לתשובה:</b> ${esc(it.m)}</div>`:''}`;
    }
    return `<div class="item"><span class="n">${k+1}.</span><div class="body">${inner}</div></div>`}).join('');
  const total=pg.i.filter(x=>x.k!=='w').length;
  const res=st.c?`<div class="result"><span>ענית נכון על ${st.s} מתוך ${st.t}</span><span class="btns"><button class="btn ghost" data-hfix>תקן רק את הטעויות</button><button class="btn ghost" data-hreset>התחל את העמוד מחדש</button></span></div>`:'';
  frame(i,'hw',`<div class="pager"><span class="sub">עמוד</span>${sel}</div>
   <div class="hwhead"><span>שיעורי בית: ${pg.t}</span><span>${hp+1} / ${u.hw.length}</span></div>
   <p>${pg.d}</p><div class="items">${items}</div>${res}
   <div class="btns">${st.c?'':`<button class="btn" data-hcheck>בדוק את העמוד</button>`}${hp<u.hw.length-1?`<button class="btn ghost" data-hp="${hp+1}">לעמוד הבא</button>`:`<button class="btn ghost" data-tab="test">למבחן הסיום</button>`}</div>
   <p class="sub">כתיבה באנגלית: אותיות גדולות וקטנות ופיסוק לא משנים. קיצורים כמו I'm ו-I am מתקבלים שניהם (חוץ מבתרגילי קיצור).</p>`);
}
function hwCheck(){
  const u=UNITS[view.i],pg=u.hw[view.hp],st=hwState(u,view.hp);
  let s=0,t=0;
  pg.i.forEach((it,k)=>{if(it.k==='w')return;t++;if(isOk(it,st.v[k]||''))s++});
  st.c=1;st.s=s;st.t=t;save();hw(view.i);
}
/* ===== quizzes ===== */
function vocabQs(u){
  const pool=u.vocab;
  return shuffle(pool.map((_,k)=>k)).map((k,j)=>{
    const [en,he]=pool[k],toHe=j%2===0;
    const wr=shuffle(pool.filter((_,x)=>x!==k)).slice(0,3);
    return toHe?{p:en,speak:en,c:he,w:wr.map(x=>x[1]),e:`${en} = ${he}`}:{p:he,c:en,w:wr.map(x=>x[0]),e:`${en} = ${he}`};
  });
}
function startRun(i,mode){
  const u=UNITS[i];let qs;
  if(mode==='vq')qs=vocabQs(u);else if(mode==='test')qs=shuffle(u.bank).slice(0,15);else qs=shuffle(u.bank);
  run={i,mode,qs:qs.map(q=>({...q,opts:shuffle([q.c,...q.w])})),n:0,ans:[],fb:false};
  view={name:'unit',i,tab:mode,n:0,hp:0};
  quiz();
}
function quiz(){
  const {qs,n,mode,fb,i}=run,q=qs[n],pick=run.ans[n],instant=mode==='practice';
  const opts=q.opts.map((o,k)=>{
    let cls='opt';
    if(instant&&fb){cls+=o===q.c?' right':(o===pick?' wrong':'')}else if(pick===o)cls+=' picked';
    return `<button class="${cls}" dir="auto" data-pick="${k}" ${instant&&fb?'disabled':''}>${esc(o)}</button>`}).join('');
  frame(i,mode,`<div class="qhead"><span>שאלה ${n+1} מתוך ${qs.length}</span><span>${NAMES[mode]}</span></div>
   <div class="bar"><i style="width:${n/qs.length*100}%"></i></div>
   <div class="qp" dir="auto">${q.speak?spkBtn(q.speak):''}<span>${esc(q.p)}</span></div>
   <div class="opts">${opts}</div>
   ${instant&&fb?`<div class="fb ${pick===q.c?'ok':'no'}">${pick===q.c?'נכון. ':'לא נכון. התשובה: <b dir="ltr">'+esc(q.c)+'</b>. '}${esc(q.e)}</div>`:''}
   <div class="btns"><button class="btn" data-next ${pick===undefined?'disabled':''}>${instant&&!fb?'בדוק':(n===qs.length-1?'סיום':'הבא')}</button></div>`);
}
function finish(){
  const {qs,ans,mode,i}=run,u=UNITS[i],p=P(u.id);
  const ok=qs.filter((q,k)=>ans[k]===q.c).length,pct=Math.round(ok/qs.length*100);
  const need=mode==='vq'?90:(mode==='test'?100:0),pass=pct>=need;
  if(mode==='vq')p.vq=Math.max(p.vq,pct);
  if(mode==='test')p.t=Math.max(p.t,pct);
  if(mode==='practice')p.pr=1;
  save();
  const wrong=qs.map((q,k)=>({q,a:ans[k]})).filter(x=>x.a!==x.q.c);
  const msg=mode==='practice'?`ענית נכון על ${ok} מתוך ${qs.length}. אפשר לחזור על התרגול כמה שרוצים.`
    :pass?(mode==='test'?'מעולה. ציון מושלם. היחידה הבאה נפתחה.':'עברת. אפשר להמשיך לתרגול, לשיעורי הבית ולמבחן הסיום.')
    :(mode==='test'?'צריך 100 כדי להמשיך. עבור על הטעויות ונסה שוב. השאלות מתחלפות.':'צריך 90 לפחות. עבור על הטעויות ונסה שוב.');
  const nextBtn=pass&&mode==='test'&&i+1<UNITS.length?`<button class="btn" data-unit="${i+1}">ליחידה הבאה</button>`:'';
  const nextTab=pass&&mode==='vq'?`<button class="btn" data-tab="practice">לתרגול</button>`:'';
  frame(i,mode,`<div class="score ${mode==='practice'?'':pass?'ok':'no'}">${pct}</div><p class="center">${msg}</p>
   <div class="btns">${nextBtn}${nextTab}${(!pass||mode==='practice')?`<button class="btn" data-again>${mode==='practice'?'עוד סיבוב':'נסה שוב'}</button>`:''}</div>
   ${wrong.length?`<h3>מה לתקן (${wrong.length})</h3>`+wrong.map(x=>`<div class="rev"><div dir="auto"><b>${esc(x.q.p)}</b></div><div class="sub">התשובה שלך: <span dir="auto">${esc(x.a===undefined?'לא ענית':x.a)}</span></div><div class="sub" style="color:var(--green)">נכון: <b dir="auto">${esc(x.q.c)}</b></div><div class="sub">${esc(x.q.e)}</div></div>`).join(''):'<p class="center sub">בלי אף טעות.</p>'}`);
}
/* ===== events ===== */
document.addEventListener('click',ev=>{
  const t=ev.target.closest('button');if(!t)return;
  const d=t.dataset;
  if(d.s){speak(d.s);return}
  if(t.hasAttribute('data-home')){resetArm=false;home();return}
  if(d.unit!==undefined){openTab(+d.unit,'lesson');return}
  if(t.hasAttribute('data-reset')){if(resetArm){prog={};save();resetArm=false}else resetArm=true;home();return}
  if(d.tab){openTab(view.i,d.tab);return}
  if(d.start){startRun(view.i,d.start);return}
  if(d.lp!==undefined){view.n=+d.lp;lesson(view.i);return}
  if(d.pg){
    const u=UNITS[view.i],n=view.n+(+d.pg);
    if(n>=u.lessons.length){P(u.id).read=1;save();openTab(view.i,'vocab')}else{view.n=n;lesson(view.i)}
    return}
  if(d.hp!==undefined){view.hp=+d.hp;hw(view.i);return}
  if(d.hm){const [k,j]=d.hm.split(':').map(Number),u=UNITS[view.i],st=hwState(u,view.hp);st.v[k]=st.o[k][j];save();hw(view.i);return}
  if(t.hasAttribute('data-hcheck')){hwCheck();return}
  if(t.hasAttribute('data-hreset')){const u=UNITS[view.i];delete P(u.id).hw[view.hp];save();hw(view.i);return}
  if(t.hasAttribute('data-hfix')){
    const u=UNITS[view.i],pg=u.hw[view.hp],st=hwState(u,view.hp);
    pg.i.forEach((it,k)=>{if(it.k!=='w'&&!isOk(it,st.v[k]||'')){st.v[k]='';delete st.o[k]}});
    st.c=0;save();hw(view.i);return}
  if(d.pick!==undefined){
    if(run.mode==='practice'&&run.fb)return;
    run.ans[run.n]=run.qs[run.n].opts[+d.pick];quiz();return}
  if(t.hasAttribute('data-next')){
    if(run.mode==='practice'&&!run.fb){run.fb=true;quiz();return}
    run.fb=false;
    if(run.n===run.qs.length-1)finish();else{run.n++;quiz()}
    return}
  if(t.hasAttribute('data-again')){startRun(run.i,run.mode);return}
});
document.addEventListener('input',ev=>{
  const el=ev.target;if(el.dataset&&el.dataset.i!==undefined&&view.tab==='hw'){
    const u=UNITS[view.i],st=hwState(u,view.hp);st.v[+el.dataset.i]=el.value;save()}
});
document.addEventListener('keydown',ev=>{
  const el=ev.target;
  if(ev.key==='Enter'&&el.tagName==='INPUT'&&el.dataset.i!==undefined){
    ev.preventDefault();
    const all=[...app.querySelectorAll('input[data-i],textarea[data-i]')],k=all.indexOf(el);
    if(all[k+1])all[k+1].focus();return}
  if(view.tab==='lesson'&&view.name==='unit'&&!/INPUT|TEXTAREA/.test(el.tagName)){
    const u=UNITS[view.i];
    if(ev.key==='ArrowLeft'&&view.n<u.lessons.length-1){view.n++;lesson(view.i)}
    if(ev.key==='ArrowRight'&&view.n>0){view.n--;lesson(view.i)}}
});
home();
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
